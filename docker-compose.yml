# NightWatch: `docker compose up --build`  ->  dashboard http://localhost:8080 | API docs http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-nightwatch-synthetic-demo-secret-change-me}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - nightwatch-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  nightwatch-data:
