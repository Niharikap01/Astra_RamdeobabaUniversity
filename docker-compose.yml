# NightWatch: `docker compose up --build`  ->  dashboard http://localhost:8080 | API docs http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: demo
      DEMO_MODE: "true"
      # Local synthetic demo default only; set JWT_SECRET_KEY to override it.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-nightwatch-DEMO-ONLY-insecure-secret}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "127.0.0.1:${NIGHTWATCH_API_PORT:-8000}:8000"
    volumes:
      - nightwatch-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  nightwatch-data:
